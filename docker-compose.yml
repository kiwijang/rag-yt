services:
  mineru:
    build: ./services/mineru
    image: ragyt-mineru:2.7.6
    container_name: ragyt-mineru
    restart: unless-stopped
    ports:
      - "127.0.0.1:8090:8000"
    gpus: all
    shm_size: 2gb
    environment:
      MINERU_MODEL_SOURCE: huggingface
      MINERU_FORMULA_ENABLE: "false"
      MINERU_TABLE_ENABLE: "true"
      MINERU_VIRTUAL_VRAM_SIZE: "8"
    volumes:
      - mineru_models:/models
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=10)"]
      interval: 15s
      timeout: 15s
      retries: 8
      start_period: 60s
  postgres:
    image: postgres:16
    container_name: ragyt-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ragyt
      POSTGRES_USER: ragyt
      POSTGRES_PASSWORD: ragyt123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ragyt -d ragyt"]
      interval: 10s
      timeout: 5s
      retries: 5

  weaviate:
    image: semitechnologies/weaviate:1.25.5
    container_name: ragyt-weaviate
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "50051:50051"
    environment:
      QUERY_DEFAULTS_LIMIT: 25
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      PERSISTENCE_DATA_PATH: "/var/lib/weaviate"
      DEFAULT_VECTORIZER_MODULE: "none"
      CLUSTER_HOSTNAME: "node1"
    volumes:
      - weaviate_data:/var/lib/weaviate

  swagger-ui:
    image: swaggerapi/swagger-ui
    ports:
      - "8081:8080"
    environment:
      SWAGGER_JSON_URL: https://raw.githubusercontent.com/weaviate/weaviate/master/openapi-specs/schema.json

volumes:
  mineru_models:
  postgres_data:
  weaviate_data:
